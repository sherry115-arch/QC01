" aria-label="答對題數"></progress><p class="small">可以提示、可以重來。<br>理解，比速度重要。</p><div class="badges"><span id="b0" class="badge">○ 畫面觀察者</span><span id="b1" class="badge">○ 意象解讀者</span><span id="b2" class="badge">○ 詩意思考者</span></div><p class="small">進度與草稿只保存在此瀏覽器。</p></aside><section id="content" class="panel" tabindex="-1" role="tabpanel"></section></div><p id="notice" class="notice" role="status"></p><footer class="foot">依附件康軒國文二上第一課〈小詩選〉備課資料設計；導讀、題目、解析與創作示例為重新撰寫。閱讀原詩請搭配自己的課本。配樂為程式合成原創旋律；朗讀使用裝置語音，支援度依瀏覽器而異。</footer></main><script>

function audio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error();if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,duration=.2,volume=.06,target){try{let a=audio(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(volume,a.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+duration);o.connect(g);g.connect(target||a.destination);o.start();o.stop(a.currentTime+duration)}catch{}}function chime(){if(sfx){tone(659);setTimeout(()=>tone(784,.3),130)}}

const poems=[{title:'跳水',author:'艾青',intro:'用鏡頭般的語言，留住運動員入水前後的片刻。畫面之外，也能讀到投入理想的熱情。',bio:'艾青曾學習繪畫。這首詩以鮮明色彩和流暢動態，讓文字具有畫面感。',cards:[['時間鏡頭','先是期待，再是優美的動作，最後是水花與觀眾的回應。短短六行，形成完整的過程。'],['色彩線索','深藍的池水與白色水花構成對照。顏色不只描繪景物，也使讀者感受到理想的吸引力。'],['動作背後','選手的鎮定與流暢，可以讓人推想背後的練習。這是根據文字作推論，不是詩中直接記載的訓練日誌。']],words:[['湛藍','ㄓㄢˋ ㄌㄢˊ：深藍色。此處由池水的色彩延伸到對理想的嚮往。'],['陶醉','ㄊㄠˊ ㄗㄨㄟˋ：深深沉浸在喜愛的事物中。用來讀出選手的投入。'],['從容','ㄘㄨㄥ ㄖㄨㄥˊ：鎮定、不慌忙。留意「從」在此讀一聲。'],['曲線','ㄑㄩ ㄒㄧㄢˋ：彎曲的線條。「歌曲」的曲才讀ㄑㄩˇ。']]},{title:'風箏',author:'白靈',intro:'從牽線與高飛的互動，看見小小的人如何面對廣大的世界。這首詩把放風箏寫成追尋希望的過程。',bio:'白靈本名莊祖煌，具化工背景，作品富於想像。這首詩從放風箏的生活經驗發展出人生聯想。',cards:[['意象的兩層','眼前是風箏與細線；往深處想，風箏可讀為希望，細線可讀為人的有限力量。'],['大小的張力','細線與天空形成力量上的懸殊。對比越強，越能突顯主動追尋的志氣。'],['結尾的行動','結尾從觀察轉向行動，把希望化成向前的動力。讀的是精神，不是實際以手拉動整片天空。']],words:[['扶搖直上','ㄈㄨˊ ㄧㄠˊ ㄓˊ ㄕㄤˋ：乘風迅速上升；也可比喻事業或地位快速提升。'],['河堤','ㄏㄜˊ ㄊㄧˊ：沿河修築的防水高岸。「堤」讀ㄊㄧˊ。'],['拔／跋','拔河用手，所以是「拔」；跋山涉水要行走，所以是「跋」。'],['象徵','用具體事物寄託抽象意義；仍要結合整首詩的脈絡，不能看到物品就任意套答案。']]}];
function explore(){let p=poems[poem];C.innerHTML=`<div class="tabs"><button data-poem="0" class="${poem===0?'primary':''}">〈跳水〉・艾青</button><button data-poem="1" class="${poem===1?'primary':''}">〈風箏〉・白靈</button></div><span class="tag">READ & NOTICE</span><h2>先看見，再想遠一點。</h2><p class="lead">${p.intro}</p><div class="row"><button id="readIntro">▷ 聽導讀</button><span class="small">搭配課本讀原詩，再點開線索。</span></div><p class="small">${p.bio}</p><div class="grid">${p.cards.map((x,i)=>`<div class="card"><h3>${x[0]}</h3><button class="reveal" data-i="${i}" aria-expanded="false">打開閱讀線索 ＋</button><p id="clue${i}" hidden>${x[1]}</p></div>`).join('')}</div><hr class="divider"><h3>字詞口袋 · 點一下釐清</h3><div class="chips">${p.words.map((w,i)=>`<button data-word="${i}">${w[0]}</button>`).join('')}</div><div id="wordInfo" class="hint" role="status">挑一個你想確認的字詞。</div><button class="primary" id="toQuiz">帶著線索，試一題 →</button>`;C.querySelectorAll('[data-poem]').forEach(b=>b.onclick=()=>{poem=+b.dataset.poem;stopSpeech();explore()});C.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{let e=$('#clue'+b.dataset.i);e.hidden=!e.hidden;b.setAttribute('aria-expanded',!e.hidden);b.textContent=e.hidden?'打開閱讀線索 ＋':'收起線索 −'});C.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{$('#wordInfo').textContent=p.words[+b.dataset.word][1]});$('#readIntro').onclick=()=>speak(p.intro+'。'+p.bio);$('#toQuiz').onclick=()=>navigate('challenge')}

['〈跳水〉中，選手鎮定流暢的動作最合理暗示什麼？',['完全不需要練習','只在乎贏過別人','長期練習與投入'],2,'區分表面輕鬆和背後準備。','從動作的從容推想苦練，是有文本依據的推論；不能因此斷言天分取代所有努力。'],
['把水花的白色與觀眾讚美連在一起，主要效果是？',['讓抽象讚美具有可見的畫面','說觀眾都穿白衣','交代當天下雪'],0,'感受和顏色被連在一起了。','讚美本來沒有顏色；詩把水花與喝采融合，讓感受變得具體，也使文字更精鍊。'],
['〈風箏〉中，細線和廣大天空的對比突顯什麼？',['細線的品牌很重要','人的力量有限，仍願面對環境','希望完全不受環境影響'],1,'注意大小與力量的差距。','有限的人力面對龐大的現實環境，凸顯追尋者的志氣；不是保證永遠不會遇到阻礙。'],
['〈風箏〉把一生與遊戲連結，較貼近哪種理解？',['人生可以完全不用負責','所有理想都沒有價值','追尋像放風箏，看似簡單卻需投入'],2,'把這個比喻放回全詩積極行動的脈絡。','遊戲的比喻連到放風箏的投入和掌握，不能單獨截出來解作遊戲人生。'],
['哪一組最符合兩詩的意象差異？',['池水—理想；天空—外在環境','池水—金錢；天空—獎盃','兩詩的天空都象徵理想'],0,'不要把不同作品的象徵直接混用。','〈跳水〉以池水寄託對理想的嚮往；〈風箏〉的天空可讀為未知而有挑戰的外在環境。'],
['小詩雖短，仍能意義豐富，關鍵較可能是？',['省去一切意義','用精鍊語言與意象留下聯想空間','每首都必須講完完整故事'],1,'思考具體畫面能否帶出抽象想法。','意象、象徵與精準的語言，能在少量文字中承載多層意義。短，不等於內容單薄。'],
['同學說：「兩首詩都保證努力一定成功。」哪個回應最完整？',['同意，詩是保證結果的規則','不同意，所以努力毫無意義','詩肯定投入與追求，不能當成現實的成功保證'],2,'分清文學傳達的價值與現實中的必然因果。','兩詩呈現積極追尋的態度；真實結果仍受條件影響。可以努力，也可以求助、調整策略與目標。'],
['如果刪掉〈風箏〉結尾的主動行動，最可能失去什麼？',['從嚮往走向實踐的力量','風箏的顏色說明','作者的出生地'],0,'想像全詩停在觀看，沒有後續動作。','結尾把希望轉成行動。少了這個轉折，面對環境仍向前的生命態度就不夠鮮明。'],
['比較兩詩，哪一句最有具體依據？',['兩詩完全相同，都是風景介紹','〈跳水〉凝聚瞬間；〈風箏〉由物象拓展人生聯想','兩詩都只談比賽勝負'],1,'比較時間尺度與意義的延伸。','〈跳水〉聚焦一次動作的前中後；〈風箏〉由放風箏聯想到人生。兩者都能通向追求理想。'],
['原創句「橡皮擦，把失誤輕輕推開」最明顯運用了什麼？',['把物品寫得像人，形成擬人','誇張地寫出巨大尺寸','用反問責備讀者'],0,'「輕輕推開」被交給誰來做？','橡皮擦被賦予主動、溫柔的動作，形成擬人。若再連結重新開始，也能發展象徵意義。'],
['分析象徵時，哪種做法最可靠？',['看到藍色一律解釋成悲傷','只說自己喜歡就算證據','提出解讀，再用相關畫面與上下文支持'],2,'解讀可以多元，但不能沒有根據。','可用「物象→意義→依據」三步：先指出物，再說聯想，最後用上下文檢查是否合理。'],

];
function startQuiz(review=false){queue=review?[...mistakes].filter(i=>Math.floor(i/6)===level):Array.from({length:6},(_,i)=>level*6+i);idx=0;quiz()}
function quiz(){answered=false;tries=0;C.innerHTML=`<div class="row">${['易 · 讀懂畫面','中 · 解開象徵','難 · 比較思辨'].map((s,i)=>`<button class="level ${i===level?'active':''}" data-level="${i}">${s}</button>`).join('')}</div><p class="small">三階都能自由進入；每階 6 題，答錯可以用提示再試。</p><div id="quizbody"></div>`;C.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;startQuiz()});if(!queue.length){$('#quizbody').innerHTML='<h2>這一階目前沒有待複習題。</h2><button id="again">回到完整練習</button>';$('#again').onclick=()=>startQuiz();return}if(idx>=queue.length){let got=Array.from({length:6},(_,i)=>level*6+i).filter(i=>done.has(i)).length;$('#quizbody').innerHTML=`<span class="tag">A LITTLE MORE UNDERSTANDING</span><h2>這一輪，留下了新的理解。</h2><p>此階已掌握 ${got} / 6 題。需要多試一次的題目，就是下次的閱讀線索。</p><div class="row"><button id="review">重練此階待複習題</button><button id="again">再走一次</button><button id="nextLevel" class="primary">${level<2?'試試下一階':'去意象連線'}</button></div>`;$('#again').onclick=()=>startQuiz();$('#review').onclick=()=>startQuiz(true);$('#nextLevel').onclick=()=>{if(level<2){level++;startQuiz()}else navigate('match')};return}let id=queue[idx],q=questions[id];$('#quizbody').innerHTML=`<div class="row"><span class="tag">QUESTION ${String(idx+1).padStart(2,'0')} / ${queue.length}</span><button id="readQuestion">▷ 朗讀題目</button></div><h2>${q[0]}</h2><div id="options">${q[1].map((o,i)=>`<button class="option" data-answer="${i}"><b>${'ABC'[i]}</b><span>${o}</span></button>`).join('')}</div><button id="hintButton" aria-expanded="false">給我一點線索</button><div id="hint" class="hint" hidden>${q[3]}</div><div id="feedback" role="status" aria-live="polite"></div><button id="nextQuestion" class="primary" hidden>${idx+1===queue.length?'看看本輪成果':'下一題 →'}</button>`;$('#hintButton').onclick=()=>{$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true')};$('#readQuestion').onclick=()=>speak(q[0]+q[1].map((o,i)=>'。選項'+['一','二','三'][i]+'，'+o).join(''));C.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;let i=+b.dataset.answer;if(i===q[2]){answered=true;b.classList.add('correct');C.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);done.add(id);if(tries===0)mistakes.delete(id);$('#feedback').className='feedback good';$('#feedback').textContent=(tries?'你用線索修正了判斷。':'這個判斷有依據。')+q[4];$('#nextQuestion').hidden=false;chime()}else{tries++;mistakes.add(id);b.classList.add('wrong');b.disabled=true;$('#feedback').className='feedback retry';$('#feedback').textContent='這個選項還不夠貼近文本。'+q[3]+' 再比較剩下的選項。'}stats();save()});$('#nextQuestion').onclick=()=>{stopSpeech();idx++;quiz()}}
const pairs=[['池水的深藍','對美好理想的嚮往'],['高臺與水面的落差','實踐理想的不容易'],['風箏','希望與理想'],['牽引的細線','人的有限力量'],['廣大的天空','外在環境與未知挑戰']];let matched=new Set(),selected=null;
function match(){C.innerHTML=`<span class="tag">CONNECT THE MEANING</span><h2>物象，還能說什麼？</h2><p>先點左邊的物象，再點右邊的意義。手機也能用點選完成。</p><div class="matchgrid"><div class="matchcol">${pairs.map((p,i)=>`<button data-left="${i}">${p[0]}</button>`).join('')}</div><div class="matchcol">${[3,0,4,2,1].map(i=>`<button data-right="${i}">${pairs[i][1]}</button>`).join('')}</div></div><div id="matchFeedback" class="feedback" role="status">已連結 ${matched.size} / 5 組。</div><button id="resetMatch">重新連線</button>`;paintMatch();C.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{selected=+b.dataset.left;paintMatch();$('#matchFeedback').textContent='已選「'+pairs[selected][0]+'」，請選右邊的意義。'});C.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(selected===null){$('#matchFeedback').textContent='先從左邊挑選一個物象。';return}if(selected===+b.dataset.right){matched.add(selected);selected=null;chime();paintMatch();$('#matchFeedback').className='feedback good';$('#matchFeedback').textContent=matched.size===5?'全部連上了！你已把具體物象與抽象意義連結起來。試著在創作裡使用一次。':`連結合理！已完成 ${matched.size} / 5 組。`}else{$('#matchFeedback').className='feedback retry';$('#matchFeedback').textContent='再想一想：'+(selected<2?'〈跳水〉把運動的畫面連到理想。':'〈風箏〉要區分希望、人的力量與外在環境。')}});$('#resetMatch').onclick=()=>{matched.clear();selected=null;match()}}
function paintMatch(){C.querySelectorAll('[data-left]').forEach(b=>{let i=+b.dataset.left;b.classList.toggle('selected',selected===i);b.classList.toggle('matched',matched.has(i));b.disabled=matched.has(i);b.setAttribute('aria-pressed',selected===i)});C.querySelectorAll('[data-right]').forEach(b=>{b.classList.toggle('matched',matched.has(+b.dataset.right));b.disabled=matched.has(+b.dataset.right)})}
function write(){C.innerHTML=`<span class="tag">YOUR SMALL POEM</span><h2>給一件日常小物，另一種意義。</h2><p>寫 3～6 行。選一個物品、給它動作，再讓它藏著你的想法。不必押韻，也不必分享私事。</p><div class="chips">${['書籤 → 陪伴','橡皮擦 → 重新開始','窗 → 好奇','種子 → 等待'].map(s=>`<button class="prompt">${s}</button>`).join('')}</div><div id="writingHint" class="hint">試著想：它看起來怎樣？正在做什麼？讓你想到哪種感受？</div><label for="draft">我的小詩</label><textarea id="draft" maxlength="1200" placeholder="例如選一件日常物品，先寫下你看見的畫面……">${esc(draft)}</textarea><p id="draftCount" class="small"></p><section class="upload-box" id="uploadBox"><h3>上傳我的小詩</h3><p class="small">按下提交後，以下署名、標題與小詩會傳到老師的雲端資料夾。只需填班級／座號或暱稱。</p><div class="grid"><label>班級／座號或暱稱<input id="poemAuthor" maxlength="40" autocomplete="off" placeholder="例：二年三班 12 號" style="display:block;width:100%;padding:.6rem"></label><label>作品標題<input id="poemTitle" maxlength="60" placeholder="例：書籤的等待" style="display:block;width:100%;padding:.6rem"></label></div><p><button id="submitPoem" class="primary" ${!GAS_URL||uploadBusy?'disabled':''}>${uploadBusy?'正在提交…':'☁ 上傳作品到老師的雲端資料夾'}</button></p><div id="uploadStatus" role="status" aria-live="polite">${GAS_URL?'提交前，請再讀一遍你的作品。':'老師正在準備收件功能，現在可以先下載作品保存。'}</div></section><div class="row"><button id="checkDraft" class="primary">看看我的創作線索</button><button id="readDraft">▷ 聽聽節奏</button><button id="download">下載我的小詩</button></div><div id="writingFeedback" role="status"></div><hr class="divider"><h3>自己讀一遍，勾選有做到的事</h3><label class="check"><input type="checkbox" class="rubric"> 我寫了一個看得見的物品或畫面。</label><label class="check"><input type="checkbox" class="rubric"> 我用動作、聲音或顏色讓畫面鮮明。</label><label class="check"><input type="checkbox" class="rubric"> 我能說明這個物品寄託什麼想法。</label><p id="rubricResult" class="small" role="status">這是自我檢核，不是作品好壞的評分。</p><details><summary>看一個原創示例</summary><div class="hint">書籤留在半途，<br>替昨天的我，<br>守住明天的入口。</div><p class="small">書籤是具體物品；「守住」賦予它人的動作；入口連到再次閱讀的可能。這是一種寫法，不是唯一答案。</p></details>`;$('#submitPoem').onclick=submitPoem;function count(){$('#draftCount').textContent=draft.length+' / 1200 字元 · 自動保存在此瀏覽器'}count();$('#draft').oninput=()=>{draft=$('#draft').value;save();count()};C.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>{$('#writingHint').textContent='你的起點：'+b.textContent+'。先寫一個能被看見的動作，再暗示右邊的意義。'});$('#checkDraft').onclick=()=>{let lines=draft.split('\n').filter(x=>x.trim());$('#writingFeedback').className='feedback';$('#writingFeedback').textContent=!draft.trim()?'先留下一行就好：你看見的物品，正在做什麼？':`目前有 ${lines.length} 行。`+(lines.length<3?'可以補上物品的動作，以及它讓你想到的感受。':lines.length>6?'試著刪去重複的說明，看看能不能留下 3～6 行最有力量的文字。':'已符合這次的行數練習。再讀一次：是否有一個具體畫面，能讓讀者自己聯想到你的想法？')+' 這是形式提醒，不會自動判定詩意或優劣。'};$('#readDraft').onclick=()=>{if(draft.trim())speak(draft);else $('#writingFeedback').textContent='先寫下一行，再聽聽它的節奏。'};$('#download').onclick=()=>{if(!draft.trim()){$('#writingFeedback').textContent='先寫下一行，再下載保存。';return}let blob=new Blob(['我的小詩\n\n'+draft],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的小詩.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};C.querySelectorAll('.rubric').forEach(b=>b.onchange=()=>{let n=C.querySelectorAll('.rubric:checked').length;$('#rubricResult').textContent=['先挑一項，作為這次修改的方向。','已有一個起點，再加一個可感受的細節。','線索越來越完整，可以試著說明物品與想法的連結。','三個面向都自我確認了。最後朗讀一遍，刪掉一個不必要的字。'][n]})}
async function submitPoem(){
 if(uploadBusy||!GAS_URL)return;
 const author=$('#poemAuthor').value.trim(),title=$('#poemTitle').value.trim(),poem=draft.trim(),status=$('#uploadStatus');
 if(!author||!title||!poem){status.textContent='請填寫署名、作品標題與小詩內容。';return}
 const snapshot=JSON.stringify({author,title,poem});let pending;
 try{pending=JSON.parse(localStorage.getItem('poetry-upload-pending')||'null')}catch{}
 if(!pending||pending.snapshot!==snapshot){pending={snapshot,id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)};try{localStorage.setItem('poetry-upload-pending',JSON.stringify(pending))}catch{}}
 uploadBusy=true;$('#submitPoem').disabled=true;$('#submitPoem').textContent='正在提交…';status.textContent='正在等待雲端存檔確認，請稍候。';
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),45000);
 try{
 const response=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({service:'poetry-garden',submissionId:pending.id,author,title,poem}),redirect:'follow',credentials:'omit',signal:ctrl.signal});
 if(!response.ok)throw Error('http');const result=await response.json();
 if(result.ok!==true||result.submissionId!==pending.id)throw Error('unconfirmed');
 const message='作品已成功交給老師。收件編號：'+pending.id;
 if($('#uploadStatus'))$('#uploadStatus').textContent=message;$('#notice').textContent=message;chime();
 }catch(e){const message='尚未收到存檔確認，草稿已保留。請稍後以相同內容重試；若前次已存檔，不會重複建立。也可先下載作品備份。';if($('#uploadStatus'))$('#uploadStatus').textContent=message;$('#notice').textContent=message}
 finally{clearTimeout(timer);uploadBusy=false;if($('#submitPoem')){$('#submitPoem').disabled=false;$('#submitPoem').textContent='☁ 上傳作品到老師的雲端資料夾'}}
}
function navigate(p){page=p;stopSpeech();document.querySelectorAll('[data-page]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.page===p)});if(p==='explore')explore();if(p==='challenge')startQuiz();if(p==='match')match();if(p==='write')write();C.focus({preventScroll:true})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#openUpload').onclick=()=>{if(page!=='write')navigate('write');$('#uploadBox').scrollIntoView({block:'start',behavior:'auto'});$('#poemAuthor').focus({preventScroll:true})};stats();setFont();explore();
</script></body></html>
